#Domain: Human Resource and staff Administration
#Problem Statement:Attendance,leave and work Allocation
#Last Updated:2026-02-04

Name: Policy Management
  definition:The process of defining, updating, and enforcing organizational rules related to attendance, leave, working hours, and escalation procedures within the system.
 examples:
  -HR updates office working hours and late mark rules.
  -System applies new leave policy to all employees automatically.
 aliases:
  -Rules Management
  -Policy Control
  
Name: Attendance Oversight
  definition:The activity of monitoring employee attendance records to identify late arrivals and absences in order to take appropriate managerial action.
 examples:
     -Team lead checks daily attendance of team members.
     -Team lead notices employees who are absent without prior permission.
 aliases:
  -Attendance Monitoring
  -Presence Supervision
  
Name: Task Allocation
   definition:The process of assigning, distributing, and reallocating work tasks to employees based on availability, workload, and attendance status.
  examples:
   -Assigning tasks to available employees at the start of the day.
   -Reallocating work when an employee goes on leave.
  aliases:
   -Work Assignment
   -Task Distribution
  
  Name: Leave Regularization
    definition:The process of converting an absence into approved leave based on organizational policies and managerial approval, or escalating the issue if leave was not applied.
 examples:
   -Team lead regularizes an absence due to an emergency situation.
   -Team lead raises a complaint to HR if an employee forgets to apply for leave.
aliases:
  -Attendance Adjustment
  -Leave Adjustment

Name: Work Progress Update
   definition:The process of updating the current status of a task or project in the system.
 examples:
  -Employee marks a task as “In Progress” or “50% Completed.”
  -Team lead reviews updates to monitor task progress.
 aliases:
    -Task Status Update
    -Project Progress Tracking
    
 - Name: Attendance Regularization
  definition: The process of correcting incorrect, missing, or wrongly recorded attendance entries within the system.
  examples:
    - Employee submits a request to correct a missed punch-in or punch-out.
    - Team Lead approves and updates incorrect attendance records.
  aliases:
    - Attendance Correction
    - Attendance Adjustment

- Name: Leave Approval
  definition: The authorization process carried out by a team lead or HR to approve or reject employee leave requests.
  examples:
    - Team lead approves an employee’s sick leave request.
    - HR rejects a leave request due to insufficient leave balance.
  aliases:
    - Leave Authorization
    - Leave Validation

- Name: Escalation
  definition: The process of forwarding unresolved issues or disputes to HR in cases of policy violations or exceptional circumstances.
  examples:
    - Team lead escalates a leave dispute to HR.
    - Attendance conflict is forwarded to HR for review.
  aliases:
    - Issue Escalation
    - Conflict Resolution







