<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Assign Issue</title>
    
    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="../css/views/teamlead/assign-issue.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-wrapper">
            <div id="header-container"></div>
            
            <div class="content-area" id="main-content">
                <div id="page-title" style="display:none;">Assign Issue</div>

                <!-- Back navigation -->
                <div style="display:flex; align-items:center; gap: 12px; width:100%; margin-bottom: 24px;">
                    <a href="issue-management.html" style="color:var(--text-main); font-size:20px; display:flex; align-items:center; padding:4px; text-decoration:none;">
                        <i class="ph-bold ph-arrow-left"></i>
                    </a>
                    <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Assign Issue</span>
                </div>
                
                <div id="assign-issue-container" style="max-width: 1200px; margin: 0 auto; display:grid; grid-template-columns: 1fr 1fr; gap: 24px; padding-bottom: 40px;">
                    <!-- Content will be injected by JS -->
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/teamlead/assign-issue.js"></script>
</body>
</html>
