<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Team Notifications</title>
    
    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    <link rel="stylesheet" href="../css/calendar.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/teamlead/notifications.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-wrapper">
            <div id="header-container"></div>
            
            <div class="content-area" id="main-content">
                <div style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom: 24px;">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Team Notifications</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Team Lead Portal</span>
                    </div>
                </div>
                
                <div class="tl-notif-root">
                    
                    <div class="card highlight-banner">
                        <div>
                            <h2 class="hb-title">Team Alerts</h2>
                            <div class="hb-sub">Stay on top of team activities, requests, and escalations</div>
                        </div>
                        <div class="hb-metrics">
                            <div class="hb-metric"><span class="hb-metric-val" id="met-unread">0</span><span class="hb-metric-lbl">Unread</span></div>
                        </div>
                    </div>

                    <div class="filter-bar">
                        <div class="tab-list">
                            <button class="tab-btn active" data-filter="all">All</button>
                            <button class="tab-btn" data-filter="unread">Unread</button>
                        </div>
                        <button class="btn-read-all" id="btn-mark-all"><i class="ph ph-check-double"></i> Mark All as Read</button>
                    </div>

                    <div class="notif-list" id="tl-notif-list">
                        <!-- Populated by JS -->
                    </div>

                </div>

                <div id="prof-toast"><i class="ph-fill ph-check-circle"></i> Notifications updated!</div>
            </div>
        </main>
    </div>
    
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/teamlead/notifications.js"></script>
</body>
</html>
