<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Team Attendance</title>
    
    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    <link rel="stylesheet" href="../css/views/teamlead/attendance.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-wrapper">
            <div id="header-container"></div>
            
            <div class="content-area" id="main-content">
                <div id="page-title" style="display:none;">Team Attendance Monitor</div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 id="attendance-header">Today's Office Presence</h3>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Employee ID</th>
                                    <th>Name</th>
                                    <th>Check In</th>
                                    <th>Check Out</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="attendance-body">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>
    
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/teamlead/attendance.js"></script>
</body>
</html>
