<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - HR Dashboard</title>
    
    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    <link rel="stylesheet" href="../css/calendar.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/hr/dashboard.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-wrapper">
            <div id="header-container"></div>
            
            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                        <div style="display:flex; flex-direction:column;">
                            <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Dashboard</span>
                            <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">HR Portal</span>
                        </div>
                    </div>
                </div>
                
                <div class="hr-dashboard-root">
                    <!-- Summary Row -->
                    <div class="summary-grid">
                        <div class="card summary-card">
                            <div class="sc-header">
                                <div class="sc-icon" style="background:rgba(59,130,246,0.1); color:var(--hr-info);"><i class="ph-fill ph-users"></i></div>
                                <div class="sc-trend" id="emp-trend" style="background:rgba(34,197,94,0.1); color:var(--hr-success);"></div>
                            </div>
                            <div>
                                <div class="sc-value count-anim" id="emp-count" data-val="0">0</div>
                                <div class="sc-label">Total Employees</div>
                            </div>
                        </div>

                        <div class="card summary-card">
                            <div class="sc-header">
                                <div class="sc-icon" style="background:rgba(124,58,237,0.1); color:var(--hr-primary);"><i class="ph-fill ph-rocket"></i></div>
                                <div class="sc-trend" id="proj-trend" style="background:rgba(34,197,94,0.1); color:var(--hr-success);"></div>
                            </div>
                            <div>
                                <div class="sc-value count-anim" id="proj-count" data-val="0">0</div>
                                <div class="sc-label">Active Projects</div>
                            </div>
                        </div>

                        <div class="card summary-card">
                            <div class="sc-header">
                                <div class="sc-icon" style="background:rgba(34,197,94,0.1); color:var(--hr-success);"><i class="ph-fill ph-check-circle"></i></div>
                                <div class="sc-trend" id="present-perc" style="background:rgba(34,197,94,0.1); color:var(--hr-success);"></div>
                            </div>
                            <div>
                                <div class="sc-value count-anim" id="present-count" data-val="0">0</div>
                                <div class="sc-label">Present Today</div>
                            </div>
                        </div>

                        <div class="card summary-card">
                            <div class="sc-header">
                                <div class="sc-icon" style="background:rgba(249,115,22,0.1); color:var(--hr-warning);"><i class="ph-fill ph-calendar-x"></i></div>
                                <div class="sc-trend" id="leave-trend" style="background:rgba(239,68,68,0.1); color:var(--hr-danger);"></div>
                            </div>
                            <div>
                                <div class="sc-value count-anim" id="leave-count" data-val="0">0</div>
                                <div class="sc-label">Pending Leaves</div>
                            </div>
                        </div>
                    </div>

                    <!-- Calendar -->
                    <div class="card" id="hr-calendar-card">
                        <div style="padding:20px 20px 0 20px; font-weight:600; font-size:16px;">Company Calendar</div>
                        <div style="padding:20px;" id="hr-calendar-container"></div>
                    </div>

                    <!-- Main Grid -->
                    <div class="main-grid">
                        
                        <!-- Left: Attendance Dept Overview -->
                        <div class="card" style="display:flex; flex-direction:column;">
                            <div style="padding:20px 20px 0 20px; font-weight:600; font-size:16px;">Attendance Overview by Department</div>
                            <div class="dept-list" id="dept-list-container">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Right: Two lists stacked -->
                        <div style="display:flex; flex-direction:column; gap:24px;">
                            
                            <!-- Recent Employees -->
                            <div class="card">
                                <div style="padding:20px; font-weight:600; font-size:16px; display:flex; justify-content:space-between;">
                                    <span>Recently Added</span>
                                <a href="employee-management.html"><span style="font-size:12px; color:var(--hr-primary); cursor:pointer;">View All</span></a>
                                </div>
                                <div class="list-wrapper" id="recent-emp-container">
                                    <!-- Populated by JS -->
                                </div>
                            </div>

                            <!-- Pending Leaves -->
                            <div class="card">
                                <div style="padding:20px; font-weight:600; font-size:16px; display:flex; justify-content:space-between;">
                                    <span>Leave Approvals</span>
                                    <span class="badge blue" id="pending-leaves-badge"></span>
                                </div>
                                <div class="list-wrapper" id="leavesContainer">
                                    <!-- Populated by JS -->
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Bottom Actions -->
                    <div class="actions-grid">
                        <a href="attendance.html" class="card action-card">
                            <div class="ac-icon" style="background: var(--hr-success);"><i class="ph ph-calendar-check"></i></div>
                            <div>
                                <div style="font-weight:600; font-size:16px;">View Attendance</div>
                                <div style="font-size:12px; color:var(--text-muted);">Manage daily records</div>
                            </div>
                        </a>
                        <a href="escalations.html" class="card action-card">
                            <div class="ac-icon" style="background: var(--hr-warning);"><i class="ph ph-envelope-open"></i></div>
                            <div>
                                <div style="font-weight:600; font-size:16px;">Manage Escalations</div>
                                <div style="font-size:12px; color:var(--text-muted);">Review pending requests</div>
                            </div>
                        </a>
                        <a href="reports.html" class="card action-card">
                            <div class="ac-icon" style="background: var(--hr-primary);"><i class="ph ph-chart-bar"></i></div>
                            <div>
                                <div style="font-weight:600; font-size:16px;">View Reports</div>
                                <div style="font-size:12px; color:var(--text-muted);">Org analytics & stats</div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/hr/dashboard.js"></script>
</body>
</html>
