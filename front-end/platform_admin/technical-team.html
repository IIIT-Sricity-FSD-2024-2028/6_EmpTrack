<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Platform Admin Technical Team</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/platform_admin/_shared.css">
    <link rel="stylesheet" href="../css/views/platform_admin/technical-team.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Technical Team</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Platform Admin Portal</span>
                    </div>
                </div>

                <div class="pa-shell">
                    <div class="section-header">
                        <h2 class="section-title">Technical Team Members</h2>
                        <button class="btn btn-primary" id="btn-open-create"><i class="ph ph-plus"></i> Add Technical Member</button>
                    </div>

                    <div class="card filter-bar">
                        <div class="search-wrap">
                            <i class="ph ph-magnifying-glass"></i>
                            <input type="text" id="search-input" class="search-input" placeholder="Search by name or email...">
                        </div>
                        <div class="filters-wrap">
                            <select id="status-filter" class="filter-select">
                                <option value="all">All Status</option>
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                            <button class="btn-clear" id="btn-clear-filters"><i class="ph ph-x"></i> Clear</button>
                        </div>
                    </div>

                    <div class="card table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Member</th>
                                    <th>Contact</th>
                                    <th>Specialization</th>
                                    <th>Status</th>
                                    <th>Open</th>
                                    <th>In Progress</th>
                                    <th>Total Assigned</th>
                                    <th style="text-align:right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="team-tbody">
                                <tr class="loader-row"><td colspan="8"><div class="spinner"></div><div>Loading Technical Team...</div></td></tr>
                            </tbody>
                        </table>
                        <div class="pagination" id="team-pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Member Modal -->
    <div class="modal-overlay" id="createMemberModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Add Technical Team Member</h3>
                <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <div class="modal-body">
                <form id="create-member-form">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="cm-name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="cm-email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" id="cm-phone" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Specialization</label>
                        <input type="text" class="form-control" id="cm-specialization" placeholder="e.g. Infrastructure, Networking">
                    </div>
                    <div id="create-member-error" class="form-error" style="display:none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-modal-close>Cancel</button>
                <button class="btn btn-primary" id="btn-submit-create-member">Add Member</button>
            </div>
        </div>
    </div>

    <!-- Edit Member Modal -->
    <div class="modal-overlay" id="editMemberModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Edit Technical Team Member</h3>
                <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <div class="modal-body">
                <form id="edit-member-form">
                    <input type="hidden" id="em-id">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="em-name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="em-email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" id="em-phone" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Specialization</label>
                        <input type="text" class="form-control" id="em-specialization">
                    </div>
                    <div id="edit-member-error" class="form-error" style="display:none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-modal-close>Cancel</button>
                <button class="btn btn-primary" id="btn-submit-edit-member">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Status Confirm Modal -->
    <div class="modal-overlay" id="statusConfirmModal">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <h3 class="modal-title" id="status-confirm-title">Change Status</h3>
                <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <div class="modal-body">
                <p id="status-confirm-text" style="color:var(--text-main); margin:0;"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-modal-close>Cancel</button>
                <button class="btn btn-danger" id="btn-confirm-status">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/platform_admin/technical-team.js"></script>
</body>

</html>
