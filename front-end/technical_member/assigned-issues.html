<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Assigned Issues</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/technical_member/_shared.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Assigned Issues</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Technical Dashboard</span>
                    </div>
                </div>

                <div class="tm-shell">
                    <div class="section-header">
                        <h2 class="section-title">Issues Assigned to You</h2>
                    </div>

                    <div class="card filter-bar">
                        <div class="search-wrap">
                            <i class="ph ph-magnifying-glass"></i>
                            <input type="text" class="search-input" id="search-input" placeholder="Search by Issue ID, title, company or category...">
                        </div>
                        <div class="filters-wrap">
                            <select id="status-filter" class="filter-select">
                                <option value="all">All Status</option>
                                <option value="OPEN">Open</option>
                                <option value="IN_PROGRESS">In Progress</option>
                            </select>
                            <select id="priority-filter" class="filter-select">
                                <option value="all">All Priorities</option>
                                <option value="Critical">Critical</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                            <button class="btn-clear" id="btn-clear-filters"><i class="ph ph-x"></i> Clear</button>
                        </div>
                    </div>

                    <div class="card table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Issue ID</th><th>Company</th><th>Title</th><th>Priority</th><th>Status</th><th>Progress</th><th>Verification</th><th>Updated</th><th style="text-align:right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ai-tbody">
                                <tr class="loader-row"><td colspan="9"><div class="spinner"></div><div>Loading assigned issues...</div></td></tr>
                            </tbody>
                        </table>
                        <div class="pagination" id="ai-pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/technical_member/assigned-issues.js"></script>
</body>

</html>
