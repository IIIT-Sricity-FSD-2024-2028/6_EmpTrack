<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Issue History</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/technical_member/_shared.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Issue History</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Technical Dashboard</span>
                    </div>
                </div>

                <div class="tm-shell">
                    <div class="section-header">
                        <h2 class="section-title">Completed Work</h2>
                    </div>

                    <div class="card filter-bar">
                        <div class="chip-tabs">
                            <button class="chip-tab active" data-filter="all">All</button>
                            <button class="chip-tab" data-filter="unsubmitted">Resolved (Not Sent)</button>
                            <button class="chip-tab" data-filter="pending">Awaiting Verification</button>
                            <button class="chip-tab" data-filter="verified">Verified &amp; Closed</button>
                        </div>
                    </div>

                    <div class="card table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Issue ID</th><th>Company</th><th>Title</th><th>Priority</th><th>Status</th><th>Progress</th><th>Verification</th><th>Updated</th><th style="text-align:right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ih-tbody">
                                <tr class="loader-row"><td colspan="9"><div class="spinner"></div><div>Loading issue history...</div></td></tr>
                            </tbody>
                        </table>
                        <div class="pagination" id="ih-pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/technical_member/issue-history.js"></script>
</body>

</html>
