<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - My Tickets</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/support_member/_shared.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">My Tickets</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Support Dashboard</span>
                    </div>
                </div>

                <div class="sm-shell">
                    <div class="section-header">
                        <h2 class="section-title">Tickets Assigned to Me</h2>
                    </div>

                    <div class="card filter-bar">
                        <div class="chip-tabs">
                            <button class="chip-tab active" data-filter="all">All</button>
                            <button class="chip-tab" data-filter="open">Open</button>
                            <button class="chip-tab" data-filter="high">High Priority</button>
                            <button class="chip-tab" data-filter="escalated">Escalated</button>
                            <button class="chip-tab" data-filter="resolved">Resolved</button>
                        </div>
                    </div>

                    <div class="card table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Ticket ID</th><th>Company</th><th>Subject</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>Created</th><th style="text-align:right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="mt-tbody">
                                <tr class="loader-row"><td colspan="9"><div class="spinner"></div><div>Loading your tickets...</div></td></tr>
                            </tbody>
                        </table>
                        <div class="pagination" id="mt-pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/support_member/my-tickets.js"></script>
</body>

</html>
