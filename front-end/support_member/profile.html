<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Support Member Profile</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/support_member/_shared.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title" style="display:none;">Support Member Profile</div>

                <div class="sm-shell">
                    <div class="card sm-profile-banner">
                        <div class="sm-avatar-large"><span id="avatar-initials">SM</span></div>
                        <div class="sm-banner-info">
                            <h2 class="sm-banner-name" id="profile-name">-</h2>
                            <div class="sm-banner-role">Support Member</div>
                        </div>
                    </div>

                    <div class="settings-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">
                        <div class="card settings-card" style="padding:24px;">
                            <div class="card-title"><i class="ph-fill ph-identification-card"></i> Personal Information</div>
                            <div class="detail-grid">
                                <div class="detail-item"><span class="detail-label">Employee ID</span><span class="detail-value" id="info-empId">-</span></div>
                                <div class="detail-item"><span class="detail-label">Email Address</span><span class="detail-value" id="info-email">-</span></div>
                                <div class="detail-item"><span class="detail-label">Phone Number</span><span class="detail-value" id="info-phone">-</span></div>
                                <div class="detail-item"><span class="detail-label">Role</span><span class="detail-value">Support Member</span></div>
                                <div class="detail-item"><span class="detail-label">Specialization</span><span class="detail-value" id="info-specialization">-</span></div>
                            </div>

                            <div class="card-title" style="margin-top:24px;"><i class="ph-fill ph-ticket"></i> My Ticket Summary</div>
                            <div class="detail-grid">
                                <div class="detail-item"><span class="detail-label">Open Tickets</span><span class="detail-value" id="info-open">-</span></div>
                                <div class="detail-item"><span class="detail-label">Resolved Tickets</span><span class="detail-value" id="info-resolved">-</span></div>
                                <div class="detail-item"><span class="detail-label">Escalated Tickets</span><span class="detail-value" id="info-escalated">-</span></div>
                            </div>
                        </div>

                        <div class="card settings-card" style="padding:24px;">
                            <div class="card-title"><i class="ph-fill ph-lock-key"></i> Security Settings</div>
                            <p style="font-size:13px; color:var(--text-muted); margin-top:0;">Update your password regularly to keep your account secure.</p>
                            <form id="password-form">
                                <div class="form-group">
                                    <label class="form-label">Current Password</label>
                                    <input type="password" class="form-control" id="currentPwd" required placeholder="Enter current password">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">New Password</label>
                                    <input type="password" class="form-control" id="newPwd" required minlength="8" placeholder="Enter new password">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Confirm New Password</label>
                                    <input type="password" class="form-control" id="confPwd" required placeholder="Re-type new password">
                                </div>
                                <div id="pwd-error" class="form-error" style="display:none;"></div>
                                <button type="button" class="btn-save" id="btnUpdatePwd"><i class="ph ph-check-circle"></i> Update Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/support_member/profile.js"></script>
</body>

</html>
