<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Support Dashboard</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/support_member/_shared.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Dashboard</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Support Dashboard</span>
                    </div>
                </div>

                <div class="sm-shell">
                    <div class="stats-grid" id="sm-stats-grid">
                        <!-- Populated by JS -->
                    </div>

                    <div class="card" style="padding:16px 20px; display:flex; gap:32px; flex-wrap:wrap;">
                        <div><span class="detail-label">Tickets Received</span><div class="stat-value" style="font-size:20px;" id="sm-tickets-received">-</div></div>
                        <div><span class="detail-label">Tickets Resolved</span><div class="stat-value" style="font-size:20px;" id="sm-tickets-resolved">-</div></div>
                        <div><span class="detail-label">Avg. Resolution Time</span><div class="stat-value" style="font-size:20px;" id="sm-avg-resolution">-</div></div>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">
                        <div class="card" style="padding:20px;">
                            <div class="section-header" style="margin-bottom:16px;"><h2 class="section-title">Tickets by Priority</h2></div>
                            <div style="height:220px;"><canvas id="chartPriority"></canvas></div>
                        </div>
                        <div class="card" style="padding:20px;">
                            <div class="section-header" style="margin-bottom:16px;"><h2 class="section-title">Tickets by Category</h2></div>
                            <div style="height:220px;"><canvas id="chartCategory"></canvas></div>
                        </div>
                    </div>

                    <div class="card" style="padding:20px;">
                        <div class="section-header" style="margin-bottom:16px;">
                            <h2 class="section-title">Tickets Needing Attention</h2>
                            <a href="tickets.html" style="font-size:13px; color:var(--sm-primary); text-decoration:none;">View all &rarr;</a>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Ticket ID</th><th>Company</th><th>Subject</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>Created</th><th style="text-align:right;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="sm-recent-tickets">
                                    <tr class="loader-row"><td colspan="9"><div class="spinner"></div><div>Loading...</div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/support_member/dashboard.js"></script>
</body>

</html>
