<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Super Admin Activity</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/super_admin/_shared.css">
    <link rel="stylesheet" href="../css/views/super_admin/activity.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Platform Admin Activity</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Super Admin Portal</span>
                    </div>
                </div>

                <div class="sa-shell">
                    <div class="card filter-bar">
                        <div class="filters-wrap">
                            <select id="user-filter" class="filter-select">
                                <option value="">All Users</option>
                            </select>
                            <select id="action-filter" class="filter-select">
                                <option value="">All Actions</option>
                            </select>
                            <button class="btn-clear" id="btn-clear-filters"><i class="ph ph-x"></i> Clear</button>
                        </div>
                    </div>

                    <div class="card table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Action</th>
                                    <th>Company</th>
                                    <th>Date / Time</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="activity-tbody">
                                <tr class="loader-row"><td colspan="5"><div class="spinner"></div><div>Loading activity...</div></td></tr>
                            </tbody>
                        </table>
                        <div class="pagination" id="activity-pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/super_admin/activity.js"></script>
</body>

</html>
