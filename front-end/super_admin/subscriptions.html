<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Super Admin Subscriptions</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/super_admin/_shared.css">
    <link rel="stylesheet" href="../css/views/super_admin/subscriptions.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Subscriptions</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Super Admin Portal</span>
                    </div>
                </div>

                <div class="sa-shell">
                    <div class="section-header">
                        <h2 class="section-title">Subscription Plans</h2>
                        <button class="btn btn-primary" id="btn-open-create"><i class="ph ph-plus"></i> Create Plan</button>
                    </div>

                    <div class="card table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Plan</th>
                                    <th>Price</th>
                                    <th>Billing Cycle</th>
                                    <th>Companies</th>
                                    <th>Status</th>
                                    <th style="text-align:right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="plans-tbody">
                                <tr class="loader-row"><td colspan="6"><div class="spinner"></div><div>Loading plans...</div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Plan Modal -->
    <div class="modal-overlay" id="createPlanModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Create Subscription Plan</h3>
                <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <div class="modal-body">
                <form id="create-plan-form">
                    <div class="form-group">
                        <label class="form-label">Plan Name</label>
                        <input type="text" class="form-control" id="cp-name" placeholder="e.g. Basic, Professional, Enterprise" required>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Price (USD)</label>
                            <input type="number" min="0" class="form-control" id="cp-price" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Billing Cycle</label>
                            <select class="form-control" id="cp-cycle">
                                <option value="MONTHLY">Monthly</option>
                                <option value="ANNUAL">Annual</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Max Employees</label>
                        <input type="number" min="1" class="form-control" id="cp-max-emp" placeholder="e.g. 50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Features (comma-separated)</label>
                        <input type="text" class="form-control" id="cp-features" placeholder="Attendance Tracking, Leave Management, ...">
                    </div>
                    <div id="create-plan-error" class="form-error" style="display:none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-modal-close>Cancel</button>
                <button class="btn btn-primary" id="btn-submit-create-plan">Create Plan</button>
            </div>
        </div>
    </div>

    <!-- Edit Plan Modal -->
    <div class="modal-overlay" id="editPlanModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Edit Subscription Plan</h3>
                <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <div class="modal-body">
                <form id="edit-plan-form">
                    <input type="hidden" id="ep-id">
                    <div class="form-group">
                        <label class="form-label">Plan Name</label>
                        <input type="text" class="form-control" id="ep-name" required>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Price (USD)</label>
                            <input type="number" min="0" class="form-control" id="ep-price" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Billing Cycle</label>
                            <select class="form-control" id="ep-cycle">
                                <option value="MONTHLY">Monthly</option>
                                <option value="ANNUAL">Annual</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Max Employees</label>
                        <input type="number" min="1" class="form-control" id="ep-max-emp">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Features (comma-separated)</label>
                        <input type="text" class="form-control" id="ep-features">
                    </div>
                    <div id="edit-plan-error" class="form-error" style="display:none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-modal-close>Cancel</button>
                <button class="btn btn-primary" id="btn-submit-edit-plan">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Companies using plan Modal -->
    <div class="modal-overlay" id="planCompaniesModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="plan-companies-title">Companies on this Plan</h3>
                <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <div class="modal-body" id="plan-companies-body"></div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-modal-close>Close</button>
            </div>
        </div>
    </div>

    <!-- Status Confirm Modal -->
    <div class="modal-overlay" id="statusConfirmModal">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <h3 class="modal-title" id="status-confirm-title">Change Status</h3>
                <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <div class="modal-body">
                <p id="status-confirm-text" style="color:var(--text-main); margin:0;"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-modal-close>Cancel</button>
                <button class="btn btn-danger" id="btn-confirm-status">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/super_admin/subscriptions.js"></script>
</body>

</html>
