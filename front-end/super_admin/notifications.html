<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Super Admin Notifications</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/super_admin/_shared.css">
    <link rel="stylesheet" href="../css/views/super_admin/notifications.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title" style="display:none;">Super Admin Notifications</div>

                <div class="sa-shell" style="max-width:800px; margin:0 auto;">
                    <div class="section-header">
                        <h2 class="section-title">Notifications</h2>
                    </div>
                    <div id="notif-list" style="display:flex; flex-direction:column; gap:12px;">
                        <div class="card" style="padding:40px; text-align:center;"><div class="spinner"></div><div>Loading notifications...</div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/super_admin/notifications.js"></script>
</body>

</html>
