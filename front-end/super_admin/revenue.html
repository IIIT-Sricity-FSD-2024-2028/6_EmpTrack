<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Super Admin Revenue</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/super_admin/_shared.css">
    <link rel="stylesheet" href="../css/views/super_admin/revenue.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Revenue</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Super Admin Portal</span>
                    </div>
                </div>

                <div class="sa-shell">
                    <div class="stats-grid" id="revenue-stats-grid">
                        <!-- Populated by JS -->
                    </div>

                    <div class="charts-grid">
                        <div class="card chart-card">
                            <h3 class="chart-title"><i class="ph-fill ph-chart-bar" style="color:var(--sa-primary);"></i> Revenue by Plan</h3>
                            <div class="chart-wrapper">
                                <div class="chart-skel" id="skel-by-plan"><div class="spinner"></div></div>
                                <canvas id="chartByPlan"></canvas>
                            </div>
                        </div>
                        <div class="card chart-card">
                            <h3 class="chart-title"><i class="ph-fill ph-buildings" style="color:var(--sa-success);"></i> Revenue by Company</h3>
                            <div class="chart-wrapper">
                                <div class="chart-skel" id="skel-by-company"><div class="spinner"></div></div>
                                <canvas id="chartByCompany"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="section-header">
                        <h2 class="section-title">Payment Transactions</h2>
                    </div>

                    <div class="card filter-bar">
                        <div class="filters-wrap">
                            <select id="company-filter" class="filter-select">
                                <option value="">All Companies</option>
                            </select>
                            <select id="status-filter" class="filter-select">
                                <option value="all">All Payment Status</option>
                                <option value="PAID">Paid</option>
                                <option value="PENDING">Pending</option>
                                <option value="FAILED">Failed</option>
                            </select>
                            <button class="btn-clear" id="btn-clear-filters"><i class="ph ph-x"></i> Clear</button>
                        </div>
                    </div>

                    <div class="card table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Company</th>
                                    <th>Plan</th>
                                    <th>Amount</th>
                                    <th>Billing Cycle</th>
                                    <th>Payment Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="txn-tbody">
                                <tr class="loader-row"><td colspan="6"><div class="spinner"></div><div>Loading transactions...</div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/super_admin/revenue.js"></script>
</body>

</html>
