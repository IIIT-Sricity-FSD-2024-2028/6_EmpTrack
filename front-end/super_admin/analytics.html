<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Super Admin Analytics</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/views/super_admin/_shared.css">
    <link rel="stylesheet" href="../css/views/super_admin/analytics.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title">
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:var(--font-bold); font-size:var(--text-xl);">Platform Analytics</span>
                        <span style="font-size:12px; color:var(--text-muted); font-weight:normal;">Super Admin Portal</span>
                    </div>
                </div>

                <div class="sa-shell">
                    <div class="card filter-bar">
                        <div class="filters-wrap">
                            <select id="range-select" class="filter-select">
                                <option value="today">Today</option>
                                <option value="7d">Last 7 days</option>
                                <option value="30d">Last 30 days</option>
                                <option value="6m" selected>Last 6 months</option>
                                <option value="1y">Last year</option>
                                <option value="custom">Custom range</option>
                            </select>
                            <input type="date" id="from-date" class="filter-select" style="display:none;">
                            <input type="date" id="to-date" class="filter-select" style="display:none;">
                            <button class="btn btn-primary" id="btn-apply-range">Apply</button>
                        </div>
                    </div>

                    <div class="stats-grid" id="analytics-stats-grid"></div>

                    <div class="charts-grid">
                        <div class="card chart-card">
                            <h3 class="chart-title"><i class="ph-fill ph-buildings" style="color:var(--sa-primary);"></i> Company &amp; Subscription Growth</h3>
                            <div class="chart-wrapper">
                                <div class="chart-skel" id="skel-company"><div class="spinner"></div></div>
                                <canvas id="chartCompany"></canvas>
                            </div>
                        </div>
                        <div class="card chart-card">
                            <h3 class="chart-title"><i class="ph-fill ph-users-three" style="color:var(--sa-success);"></i> Employee Growth</h3>
                            <div class="chart-wrapper">
                                <div class="chart-skel" id="skel-employee"><div class="spinner"></div></div>
                                <canvas id="chartEmployee"></canvas>
                            </div>
                        </div>
                        <div class="card chart-card" style="grid-column: 1 / -1;">
                            <h3 class="chart-title"><i class="ph-fill ph-activity" style="color:var(--sa-info);"></i> Platform Usage by Action</h3>
                            <div class="chart-wrapper" style="height:220px;">
                                <div class="chart-skel" id="skel-usage"><div class="spinner"></div></div>
                                <canvas id="chartUsage"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/super_admin/analytics.js"></script>
</body>

</html>
