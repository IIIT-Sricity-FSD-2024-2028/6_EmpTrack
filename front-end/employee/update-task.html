<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Update Task Progress</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-wrapper">
            <div id="header-container"></div>
            
            <div class="content-area" id="main-content">
                <div id="page-title" style="display:none;">Update Task Progress</div>
                <div style="display:flex; align-items:center; gap: 10px; margin-bottom: 24px;">
                    <a href="tasks.html" style="color:var(--text-main); text-decoration:none;"><i class="ph ph-arrow-left" style="font-size: 20px;"></i></a>
                    <h2 style="margin:0; font-size:var(--text-xl);">Update Task Progress</h2>
                </div>
                
                <div id="task-error-container" style="display:none;" class="card">
                    <div style="text-align:center; padding:40px;">Task Not Found. <a href="tasks.html">Return</a></div>
                </div>

                <div id="task-content-container" class="card" style="max-width: 800px; margin: 0 auto; border-radius: 12px; padding: 32px; display:none;">
                    
                    <!-- Task Info Section -->
                    <div style="margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border-light);">
                        <p id="ut-desc" style="font-size: var(--text-md); color: var(--text-main); line-height: 1.5; margin-bottom: 16px;">--</p>
                        <div style="display:inline-block; background-color: var(--bg-surface); padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-light); font-size: var(--text-sm); color: var(--text-muted);">
                            <span style="font-weight:var(--font-semibold); color:var(--text-main);">Task ID:</span> <span id="ut-id">--</span> 
                            <span style="margin: 0 10px; color: var(--border-color);">|</span> 
                            <span style="font-weight:var(--font-semibold); color:var(--text-main);">Estimated Hours:</span> <span id="ut-hours">0</span>h
                        </div>
                    </div>
                    
                    <form id="update-progress-form">
                        <!-- Progress Section -->
                        <div style="margin-bottom: 32px;">
                            <div style="display:flex; justify-content: space-between; margin-bottom: 12px;">
                                <span style="font-weight: var(--font-medium); color: var(--text-main);">Current Progress: <span id="ut-current-progress" style="color:var(--primary-color);">0%</span></span>
                                <span style="font-weight: var(--font-medium); color: var(--text-main);">New Progress: <span id="progress-val-display" style="color:var(--primary-color);">0%</span></span>
                            </div>
                            
                            <div style="position: relative; margin-bottom: 8px;">
                                <input type="range" id="progress-slider" min="0" max="100" value="0" style="width: 100%; -webkit-appearance: none; appearance: none; height: 12px; border-radius: var(--radius-full); background: #E5E7EB; outline: none; z-index: 2; position: relative;">
                                <div id="progress-fill" style="position: absolute; top:0; left:0; height: 12px; border-radius: var(--radius-full); background-color: var(--primary-color); width: 0%; z-index: 1; pointer-events:none;"></div>
                            </div>
                            
                            <div style="display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--text-muted);">
                                <span>0%</span>
                                <span>25%</span>
                                <span>75%</span>
                                <span>100%</span>
                            </div>
                        </div>
        
                        <!-- Inputs Section -->
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px;">
                            <div class="form-group" style="margin:0;">
                                <label class="form-label">Hours Spent (Today)</label>
                                <input type="number" id="hours_spent" class="form-control" placeholder="e.g. 4" style="border-radius: var(--radius-md); padding: 12px 16px;">
                            </div>
                            <div class="form-group" style="margin:0;">
                                <label class="form-label">Status</label>
                                <select id="status_input" class="form-control" style="border-radius: var(--radius-md); padding: 12px 16px;">
                                    <option value="NOT_STARTED">Not Started</option>
                                    <option value="IN_PROGRESS">In Progress</option>
                                    <option value="COMPLETED">Completed</option>
                                </select>
                            </div>
                        </div>
        
                        <!-- Notes Section -->
                        <div class="form-group" style="margin-bottom: 32px;">
                            <label class="form-label">Update Notes (Optional)</label>
                            <textarea id="update_notes" class="form-control" rows="4" placeholder="Describe what you've accomplished, any blockers, or next steps" style="border-radius: var(--radius-md); padding: 16px; resize:vertical;"></textarea>
                        </div>
        
                        <!-- Actions -->
                        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 24px;">
                            <button type="button" class="btn btn-outline" onclick="window.location.href='tasks.html'" style="border:none; color:var(--text-muted); font-weight:var(--font-medium);">Cancel</button>
                            <button type="submit" class="btn btn-purple" style="padding: 14px 32px; font-size: var(--text-md); display:flex; gap:8px; align-items:center;">
                                Update Progress <i class="ph ph-upload-simple" style="font-size:18px;"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/employee/update-task.js"></script>
</body>
</html>
