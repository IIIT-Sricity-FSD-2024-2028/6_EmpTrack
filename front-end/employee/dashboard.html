<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Dashboard</title>
    
    <!-- CSS Foundation -->
    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="../css/views/employee/dashboard.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Layout injected via JS -->
        <div id="sidebar-container"></div>
        
        <main class="main-wrapper">
            <!-- Header Layout injected via JS -->
            <div id="header-container"></div>
            
            <div class="content-area" id="main-content">
                <!-- Welcome Banner -->
                <div class="card dashboard-welcome-banner">
                    <div>
                        <h2 id="welcome-message" class="welcome-title">Welcome back!</h2>
                        <p class="welcome-subtitle">Here is your work summary for today</p>
                    </div>
                    <div class="welcome-icon">
                        <i class="ph ph-trend-up"></i>
                    </div>
                </div>

                <!-- 5 Small Components -->
                <div class="dashboard-stats-grid">
                    <div class="card stat-card">
                        <div class="stat-info">
                            <span id="stat-total" class="stat-value">0</span>
                            <span class="stat-label">Total Tasks</span>
                        </div>
                        <div class="stat-icon icon-primary">
                            <i class="ph-fill ph-briefcase"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <span id="stat-progress" class="stat-value">0</span>
                            <span class="stat-label">In Progress</span>
                        </div>
                        <div class="stat-icon icon-blue">
                            <i class="ph-fill ph-spinner-gap"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <span id="stat-pending" class="stat-value">0</span>
                            <span class="stat-label">Pending</span>
                        </div>
                        <div class="stat-icon icon-yellow">
                            <i class="ph-fill ph-clock"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <span id="stat-completed" class="stat-value">0</span>
                            <span class="stat-label">Completed</span>
                        </div>
                        <div class="stat-icon icon-green">
                            <i class="ph-fill ph-check-circle"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <span id="stat-attendance" class="stat-value">0%</span>
                            <span class="stat-label">Attendance %</span>
                        </div>
                        <div class="stat-icon icon-gray">
                            <i class="ph-fill ph-calendar-check"></i>
                        </div>
                    </div>
                </div>

                <!-- Assigned Tasks Summary -->
                <div class="card dashboard-tasks-section">
                    <div class="card-header">
                        <h3 class="section-title">Assigned Tasks Summary</h3>
                        <a href="tasks.html" class="btn btn-outline btn-sm-link">View All</a>
                    </div>
                    <div id="tasks-container" class="dashboard-tasks-list">
                        <!-- Tasks dynamically injected here -->
                    </div>
                </div>
                
                <!-- Bottom Halves -->
                <div class="dashboard-bottom-grid">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="section-title">Attendance Status</h3>
                        </div>
                        <div class="attendance-status-list">
                            <div class="attendance-status-item border-bottom">
                                <span class="status-label">Today's Status</span>
                                <span id="att-today-badge" class="badge">--</span>
                            </div>
                            <div class="attendance-status-item border-bottom">
                                <span class="status-label">Check-In Time</span>
                                <span id="att-checkin" class="status-value font-semibold">--:--</span>
                            </div>
                            <div class="attendance-status-item border-bottom">
                                <span class="status-label">Work Hours Built</span>
                                <span id="att-hours" class="status-value font-semibold">0 hrs</span>
                            </div>
                            <div class="attendance-status-item pt-10">
                                <span class="status-label">This Month</span>
                                <div class="month-status">
                                    <span id="att-month-days" class="month-days">0</span>
                                    <span id="att-month-total" class="month-total"> / 22 Days Present</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <h3 class="section-title">Recent Leave Requests</h3>
                        </div>
                        <ul id="leaves-list" class="recent-leaves-list">
                            <!-- Leaves injected here -->
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- App Initialization -->
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/employee/dashboard.js"></script>
</body>
</html>
