<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Issue Details</title>
    
    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="../css/views/employee/issue-details.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-wrapper">
            <div id="header-container"></div>
            
            <div class="content-area" id="main-content">
                <div id="page-title" style="display:none;">Issue Details</div>
                <div style="display:flex; align-items:center; gap: 15px; margin-bottom: 24px;">
                    <a href="issues-list.html" style="color:var(--text-main); text-decoration:none;"><i class="ph ph-arrow-left" style="font-size: 20px;"></i></a>
                    <div style="font-weight:var(--font-bold); font-size:var(--text-xl);">Issue Details</div>
                </div>

                <div id="issue-error" style="display:none;" class="card">
                    <div style="text-align:center; padding:40px;">Issue Not Found. <a href="issues-list.html">Return</a></div>
                </div>

                <div id="issue-content" style="display:none;">
                    <!-- Top Grid -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-xl); margin-bottom: var(--spacing-xl);">
                        
                        <!-- Card 1: Information -->
                        <div class="card" style="padding: 24px;">
                            <h3 style="margin:0 0 16px 0; font-size:var(--text-lg);">Issue Information</h3>
                            <div style="display:flex; flex-direction:column; gap: var(--spacing-md); font-size: var(--text-sm);">
                                <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border-light); padding-bottom:8px;">
                                    <span style="color:var(--text-muted);">Issue ID</span>
                                    <span style="font-weight:bold;" id="id-id">--</span>
                                </div>
                                <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border-light); padding-bottom:8px;">
                                    <span style="color:var(--text-muted);">Category</span>
                                    <span class="badge badge-low" style="padding: 2px 8px;" id="id-type">--</span>
                                </div>
                                <div>
                                    <div style="color:var(--text-muted); margin-bottom:4px;">Title</div>
                                    <div style="font-weight:bold;" id="id-title">--</div>
                                </div>
                                <div>
                                    <div style="color:var(--text-muted); margin-bottom:4px;">Description</div>
                                    <div class="form-control" style="background-color: var(--bg-main); border:none;" id="id-desc">--</div>
                                </div>
                                <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border-light); padding-bottom:8px; padding-top:8px;">
                                    <span style="color:var(--text-muted);">Raised Date</span>
                                    <span id="id-raised">--</span>
                                </div>
                                <div style="display:flex; justify-content:space-between;">
                                    <span style="color:var(--text-muted);">Assigned To</span>
                                    <span id="id-assigned">--</span>
                                </div>
                                
                                <div style="margin-top: 16px;">
                                    <div style="color:var(--text-muted); margin-bottom: 8px;">Attachments</div>
                                </div>
                            </div>
                        </div>
            
                        <!-- Card 2: Overview -->
                        <div class="card" style="padding: 24px;">
                            <h3 style="margin:0 0 16px 0; font-size:var(--text-lg);">Status Overview</h3>
                            <div style="display:flex; flex-direction:column; gap: var(--spacing-lg); font-size: var(--text-sm);">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <span style="color:var(--text-muted);">Current Status</span>
                                    <span class="badge" id="id-status-badge" style="padding:4px 12px; font-size: 12px;">--</span>
                                </div>
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <span style="color:var(--text-muted);">Priority Level</span>
                                    <div style="display:flex; align-items:center; gap: 5px;">
                                        <i class="ph ph-warning" style="color: var(--danger-color);"></i>
                                        <span class="badge" id="id-priority-badge" style="padding:2px 8px; font-size:11px;">--</span>
                                    </div>
                                </div>
                                <div style="display:flex; justify-content:space-between;">
                                    <span style="color:var(--text-muted);">Last Updated</span>
                                    <span id="id-last-updated">--</span>
                                </div>
                                <div style="display:flex; justify-content:space-between;">
                                    <span style="color:var(--text-muted);">Expected Resolution</span>
                                    <span>TBD</span>
                                </div>
            
                                <!-- Progress Bar -->
                                <div style="margin-top: 24px;">
                                    <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
                                        <span style="font-weight:bold;">Progress</span>
                                        <span style="color: var(--primary-color); font-weight:bold;" id="id-progress-text">0% Complete</span>
                                    </div>
                                    <div style="width: 100%; background-color: var(--border-color); border-radius: 4px; overflow: hidden; height: 10px;">
                                        <div id="id-progress-fill" style="width: 0%; background-color: var(--primary-color); height: 100%;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
            
                    </div>
            
                    <!-- Bottom Grid -->
                    <div style="display: grid; grid-template-columns: 1fr; gap: var(--spacing-xl);">
                        
                        <!-- Card 3: Timeline -->
                        <div class="card" style="padding: 24px;">
                            <h3 style="margin:0 0 24px 0; font-size:var(--text-lg);">Progress Timeline</h3>
                            <div id="timeline">
                                <!-- JS injected -->
                            </div>
                        </div>
            
                    </div>
            
                    <!-- Horizontal Action Bottom Buttons -->
                    <div style="display:flex; gap: var(--spacing-md); margin-top: var(--spacing-xl);">
                        <button class="btn btn-purple" id="close-issue-btn" style="flex:1; padding: 16px; font-size: var(--text-md); font-weight:bold; background-color: var(--text-main);">Close Issue</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/employee/issue-details.js"></script>
</body>
</html>
