<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Leave Management</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-wrapper">
            <div id="header-container"></div>
            
            <div class="content-area" id="main-content">
                <div id="page-title" style="display:none;">Leave Management</div>
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: var(--spacing-lg);">
                    <!-- Apply Leave Form -->
                    <div class="card">
                        <div class="card-header">
                            <h3>Apply for Leave</h3>
                        </div>
                        <form id="leave-form">
                            <div class="form-group">
                                <label class="form-label">Leave Type</label>
                                <select id="leaveType" class="form-control">
                                    <option value="CASUAL">Casual Leave</option>
                                    <option value="SICK">Sick Leave</option>
                                    <option value="PAID">Paid Leave</option>
                                    <option value="UNPAID">Unpaid Leave</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Start Date</label>
                                <input type="date" id="startDate" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">End Date</label>
                                <input type="date" id="endDate" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Reason</label>
                                <textarea id="reason" class="form-control" rows="3" required></textarea>
                            </div>
                            
                            <div id="leave-msg" class="form-error" style="display:none; margin-bottom:10px;"></div>
                            <button type="submit" class="btn btn-primary" style="width:100%;">Submit Request</button>
                        </form>
                    </div>
                    
                    <!-- History Table -->
                    <div class="card">
                        <div class="card-header">
                            <h3>My Leave History</h3>
                        </div>
                        <div class="table-container">
                            <table style="width: 100%; text-align: left; border-collapse: collapse;">
                                <thead>
                                    <tr style="border-bottom: 2px solid var(--border-color); background-color: var(--bg-surface);">
                                        <th style="padding: 12px;">Type</th>
                                        <th style="padding: 12px;">Duration</th>
                                        <th style="padding: 12px;">Applied On</th>
                                        <th style="padding: 12px;">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="leave-history-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/employee/leave.js"></script>
</body>
</html>
