<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Reset Password</title>
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/views.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background-color: var(--bg-main);">
    <div id="app" class="app-container" style="display:flex; align-items:center; justify-content:center; width:100%;">
        <div class="auth-wrapper">
            <div class="auth-container">
                <div class="auth-logo">
                    <i class="ph-fill ph-check-circle" style="font-size:36px;"></i> EmpTrack
                </div>
                <h2 class="auth-title">Reset Password</h2>
                
                <div id="forgot-step-1">
                    <p style="font-size:14px; color:var(--text-muted); margin-bottom:20px; text-align:center;">Enter your email address to reset your password.</p>
                    <form id="forgot-form" novalidate>
                        <div class="form-group">
                            <label class="form-label" for="reset-email">Email Address</label>
                            <input type="email" id="reset-email" class="form-control" placeholder="user@company.com" required>
                            <div id="reset-email-err" class="form-error" style="display:none; color:var(--danger-color); margin-top:4px; font-size:12px;"></div>
                        </div>
                        <button type="submit" id="btn-forgot-next" class="btn btn-primary" style="width:100%; margin-top:10px;">Next</button>
                    </form>
                    <div style="text-align: center; margin-top: 16px;">
                        <a href="login.html" style="color: var(--text-muted); font-size: 13px; font-weight: 500; text-decoration: none;">Back to Login</a>
                    </div>
                </div>
                
                <div id="forgot-step-2" style="display:none;">
                    <p style="font-size:14px; color:var(--text-muted); margin-bottom:20px; text-align:center;">Let's create a new password for your account.</p>
                    <form id="reset-pwd-form" novalidate>
                        <div class="form-group">
                            <label class="form-label" for="reset-new-pwd">New Password</label>
                            <input type="password" id="reset-new-pwd" class="form-control" placeholder="••••••••" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" title="Must contain at least one number, one uppercase and lowercase letter, one special character, and at least 8 or more characters">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="reset-conf-pwd">Confirm Password</label>
                            <input type="password" id="reset-conf-pwd" class="form-control" placeholder="••••••••" required>
                            <div id="reset-pwd-err" class="form-error" style="display:none; color:var(--danger-color); margin-top:4px; font-size:12px;"></div>
                        </div>
                        <button type="submit" id="btn-reset-submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Reset Password</button>
                    </form>
                    <div style="text-align: center; margin-top: 16px;">
                        <a href="login.html" style="color: var(--text-muted); font-size: 13px; font-weight: 500; text-decoration: none;">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" style="position:fixed; top:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px;"></div>

    <script type="module" src="js/views/auth/forgot-password.js"></script>
</body>
</html>
