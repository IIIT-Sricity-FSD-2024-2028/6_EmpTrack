<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Raise Issue</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    <link rel="stylesheet" href="../css/calendar.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title" style="display:none;">Raise Issue</div>
                <div style="display:flex; align-items:center; gap: 15px; margin-bottom: 24px;">
                    <a href="dashboard.html" style="color:var(--text-main); text-decoration:none;"><i class="ph ph-arrow-left" style="font-size: 20px;"></i></a>
                    <div style="font-weight:var(--font-bold); font-size:var(--text-xl);">Raise an Issue</div>
                </div>

                <div style="max-width: 720px; margin: 0 auto;">

                    <div style="background-color: var(--primary-light); border-radius: 12px; padding: 24px; margin-bottom: 24px; display:flex; gap: 16px;">
                        <div style="color: var(--primary-color); font-size: 24px;"><i class="ph ph-info"></i></div>
                        <div>
                            <h4 style="margin: 0 0 6px 0; color: var(--primary-hover); font-size: var(--text-md);">Goes straight to your Platform Admin</h4>
                            <p style="margin:0; color: var(--text-main); font-size: var(--text-sm); line-height: 1.6;">Use this for technical problems, bugs, or platform issues affecting your company. They'll be notified immediately.</p>
                        </div>
                    </div>

                    <div class="card" style="padding: 32px;">
                        <h3 style="margin: 0 0 24px 0; font-size: var(--text-lg); border-bottom: 1px solid var(--border-light); padding-bottom: 16px;">Issue Details</h3>

                        <form id="raise-company-issue-form">
                            <div style="margin-bottom: 24px;">
                                <label class="form-label" style="font-weight: var(--font-medium);">Priority Level</label>
                                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;" id="priority-grid">
                                    <div class="radio-card" data-val="LOW" style="flex-direction:column; align-items:flex-start;">
                                        <div style="font-weight:bold;">Low</div>
                                    </div>
                                    <div class="radio-card selected" data-val="MEDIUM" style="flex-direction:column; align-items:flex-start;">
                                        <div style="font-weight:bold;">Medium</div>
                                    </div>
                                    <div class="radio-card" data-val="HIGH" style="flex-direction:column; align-items:flex-start;">
                                        <div style="font-weight:bold; color:var(--danger-color);">High</div>
                                    </div>
                                    <div class="radio-card" data-val="CRITICAL" style="flex-direction:column; align-items:flex-start;">
                                        <div style="font-weight:bold; color:var(--danger-color);">Critical</div>
                                    </div>
                                </div>
                                <input type="hidden" id="selected_priority" value="MEDIUM">
                            </div>

                            <div class="form-group" style="margin-bottom: 24px;">
                                <label class="form-label" style="font-weight: var(--font-medium);">Category</label>
                                <input type="text" id="category" class="form-control" placeholder="e.g. Billing, Bug, Integration" style="border-radius: var(--radius-md); padding: 12px 16px;">
                            </div>

                            <div class="form-group" style="margin-bottom: 24px;">
                                <label class="form-label" style="font-weight: var(--font-medium);">Issue Title</label>
                                <input type="text" id="title" class="form-control" required placeholder="Brief summary of the issue" style="border-radius: var(--radius-md); padding: 12px 16px;">
                            </div>

                            <div class="form-group" style="margin-bottom: 32px;">
                                <label class="form-label" style="font-weight: var(--font-medium);">Detailed Description</label>
                                <textarea id="description" class="form-control" required rows="5" placeholder="What's happening, and what have you tried?" style="border-radius: var(--radius-md); padding: 16px; resize:vertical;"></textarea>
                            </div>

                            <div id="raise-issue-error" style="display:none; color: var(--danger-color); font-size: var(--text-sm); margin-bottom: 16px;"></div>

                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <button type="submit" class="btn btn-primary" style="padding: 14px 32px; display:flex; gap:10px; align-items:center; font-size:var(--text-md);">
                                    Raise Issue to Platform Admin <i class="ph ph-paper-plane-right"></i>
                                </button>
                                <button type="button" onclick="window.location.href='dashboard.html'" class="btn btn-outline" style="padding: 12px 32px;">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/company_admin/raise-issue.js"></script>
</body>
</html>
