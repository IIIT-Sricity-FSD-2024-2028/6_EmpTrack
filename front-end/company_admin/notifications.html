<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpTrack - Company Admin Notifications</title>

    <script src="../js/theme-init.js"></script>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/views.css">
    <link rel="stylesheet" href="../css/calendar.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .notifications-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .notification-card {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px;
            background: var(--bg-main);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            transition: background 0.2s ease;
        }

        .notification-card.unread {
            background: var(--primary-light);
        }

        .notification-icon {
            font-size: 24px;
            color: var(--primary-color);
        }

        .notification-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .notification-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-main);
        }

        .notification-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .notification-time {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
        }

        .notification-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-wrapper">
            <div id="header-container"></div>

            <div class="content-area" id="main-content">
                <div id="page-title" style="display:none;">Company Admin Notifications</div>

                <div
                    style="display:flex; justify-content:space-between; align-items:center; max-width:800px; margin:0 auto 24px auto;">
                    <div>
                        <h2 style="margin:0 0 4px 0;">Notifications</h2>
                        <div style="font-size:13px; color:var(--text-muted);">Stay updated with the latest alerts.</div>
                    </div>
                    <button class="btn btn-outline" id="btn-mark-all">Mark All as Read</button>
                </div>

                <div class="notifications-container" id="ca-notif-list">
                    <!-- Populated by JS -->
                </div>

            </div>
        </main>
    </div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/views/company_admin/notifications.js"></script>
</body>

</html>
